<!DOCTYPE html>
<html>
<head>
  <title>TP6 – ch.html CHECK</title>
</head>
<body>
<script>
  // TP3-Werte prüfen (Rohwerte)
  const A = 1;
  const B = 1;
  const C = 1;

  const tp3OK = (A === 1 && B === 1 && C === 1);

  // TP9-Werte prüfen (Maximalwerte)
  const AXIS = "IN";        // OUT / IN / EXX
  const BP   = "Start";     // Start / Mid / High

  const axisValid = ["OUT", "IN", "EXX"].includes(AXIS);
  const bpValid   = ["Start", "Mid", "High"].includes(BP);

  const tp9OK = axisValid && bpValid;

  // TP6 entscheidet Richtung
  if (tp3OK && tp9OK) {
      // beide gültig → TP9
      window.location.href = "TP9.html";
  } else if (tp3OK) {
      // nur TP3 gültig → zurück zu TP3
      window.location.href = "TP3.html";
  } else {
      // nichts gültig → Block
      document.body.innerText =
        "TP6 BLOCKIERT – Werte ungültig.\nBitte TXTME prüfen.";
  }
</script>
</body>
</html>
